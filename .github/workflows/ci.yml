name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck + client tests (mock homeserver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # native TS type-stripping runs the .ts tests
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Tests
        run: npm test

  smoke:
    name: Electron boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Download Electron binary without executing it (postinstall download is skipped on runners)
        run: node node_modules/electron/install.js

      - name: Configure Electron's SUID sandbox helper (per Electron CI docs)
        run: |
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Build and boot the app headlessly, then exit
        run: xvfb-run -a npm run smoke

  package:
    name: Package Linux distributables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app bundle
        run: npm run build

      - name: Package (AppImage, deb, portable dir)
        run: npx electron-builder --linux --publish never

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: grungus-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  package-windows:
    name: Package Windows distributables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app bundle
        run: npm run build

      - name: Package (NSIS installer + portable exe)
        run: npx electron-builder --win --publish never

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: grungus-windows
          path: |
            release/*.exe
          if-no-files-found: error

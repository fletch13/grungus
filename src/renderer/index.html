<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    CSP: scripts/styles only from this app; 'wasm-unsafe-eval' permits
    WebAssembly (libolm) without allowing eval(); images from blob/data
    (generated avatars and media); network connections allowed to any
    origin because the homeserver URL is user-configured.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data: https://static.klipy.com https://static1.klipy.com https://static2.klipy.com; connect-src *; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
  />
  <title>Grungus</title>
  <link rel="stylesheet" href="/styles/theme.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.ts"></script>
</body>
</html>

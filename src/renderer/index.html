<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    CSP: scripts/styles only from this app; images from blob/data (generated
    avatars); network connections allowed to any origin because the
    homeserver URL is user-configured.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src *"
  />
  <title>Grungus</title>
  <link rel="stylesheet" href="styles/theme.css" />
</head>
<body>
  <div id="root"></div>

  <!--
    Classic scripts (no build step). Top-level classes/consts are shared
    across scripts through the global lexical environment. Load order is
    the dependency order.
  -->
  <script src="services/matrix-client.js"></script>
  <script src="components/ui.js"></script>
  <script src="components/login-view.js"></script>
  <script src="components/space-rail.js"></script>
  <script src="components/room-list.js"></script>
  <script src="components/message-item.js"></script>
  <script src="components/chat-view.js"></script>
  <script src="components/member-list.js"></script>
  <script src="components/app-shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
